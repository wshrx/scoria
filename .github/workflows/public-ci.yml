name: ci
# Runs on the public snapshot only: dev is pushed by the snapshot exporter, main is the released
# line. The local checkout keeps the full history and the heavy harnesses.
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  ui:
    name: launcher UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: cd launcher-ui && bun install --frozen-lockfile
      - run: cd launcher-ui && bun run typecheck
      - run: cd launcher-ui && bun run check:ui
      - run: cd launcher-ui && bun run check:i18n
  launcher:
    name: launcher engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "launcher -> target"
      - run: cd launcher && cargo test --locked
  engine:
    name: engine check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-xcb-dev libfontconfig-dev \
            libasound2-dev libudev-dev
      - run: cargo check -p horizon-client --locked
  bundle:
    name: UI bundle
    runs-on: ubuntu-latest
    needs: ui
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: cd launcher-ui && bun install --frozen-lockfile && bun build --compile app.tsx --outfile /tmp/scoria-ui
