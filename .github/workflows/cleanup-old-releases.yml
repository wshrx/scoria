name: cleanup old releases
# One-off: deletes the Horizon-numbered releases that a content-scoped token cannot.
on:
  push:
    branches: [staging]
    paths: [".github/cleanup.trigger"]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for tag in v0.2.98 v0.2.99; do
            id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq .id 2>/dev/null || true)
            if [ -n "$id" ]; then
              echo "deleting release $tag ($id)"
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
            else
              echo "no release $tag"
            fi
          done
          gh api "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name'
