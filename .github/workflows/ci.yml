name: ci
# The public snapshot only: dev is the exported tree, main is the released line.
# Everything runs through `cargo xtask`, so CI and a local run are the same commands.
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  launcher:
    name: launcher (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rust: stable
          - os: windows-latest
            rust: stable
          # macOS is deferred until signing/notarization; the public repo has no
          # reliable macOS runner budget. Add it back when the release line does.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "launcher -> target"
      - uses: taiki-e/install-action@nextest
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libfontconfig-dev \
            libvulkan-dev libasound2-dev libudev-dev zstd
      - name: Gate (fmt, clippy, tests, UI build, pytest)
        run: cargo xtask gate

  # macOS is built on a self-hosted Mac (the Horizon Mac mini is the model) because GitHub's
  # public macOS runner budget is not reliable for this repo. Set the repository variable
  # MAC_RUNNER to a runner label (for example `macos-14` or `scoria-mac`); without it the job
  # is skipped and Linux/Windows still gate the change.
  macos:
    name: launcher (macOS, self-hosted)
    if: |
      vars.MAC_RUNNER != '' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ vars.MAC_RUNNER }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "launcher -> target"
      - uses: taiki-e/install-action@nextest
      - name: Gate on the Mac
        run: |
          cargo xtask check
          cargo xtask test
          cargo xtask build
