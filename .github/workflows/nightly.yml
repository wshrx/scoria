name: nightly launcher
# Builds the launcher from the nightly branch. The game is not built here: it is 800k lines
# and needs Minecraft 26.3 to prepare; this artifact is the launcher only.
on:
  push:
    branches: [nightly]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "launcher -> target"
      - name: Install the launcher's system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libfontconfig-dev \
            libvulkan-dev libasound2-dev libudev-dev
      - name: Build the launcher
        working-directory: launcher
        run: cargo build --release --locked
      - name: Upload the launcher
        uses: actions/upload-artifact@v4
        with:
          name: scoria-launcher-linux-x86_64
          path: launcher/target/release/horizon-launcher
          if-no-files-found: error
