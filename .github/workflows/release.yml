name: release
# Builds the launcher for Linux and Windows, and the game bundle for Linux and Windows (macOS is
# deferred until signing/notarization), then attaches the archives plus SHA256SUMS to the
# GitHub Release for the tag. The game archives carry no Minecraft assets; signing is the next
# release step (docs/public/RELEASE.md).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    name: verify the tagged tree
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "launcher -> target"
      - uses: taiki-e/install-action@nextest
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libfontconfig-dev \
            libvulkan-dev libasound2-dev libudev-dev zstd
      - name: Gate (fmt, clippy, tests, UI build, pytest)
        run: cargo xtask gate

  package:
    name: package (${{ matrix.name }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            script: sh tools/package_ui.sh
            file: dist/scoria-launcher-linux-x86_64.tar.*
          - name: windows-x64
            os: windows-latest
            script: sh tools/package_windows.sh
            file: dist/scoria-launcher-windows-x64.zip
            # The C runtime linked in: without it scoria.exe asks for VCRUNTIME140.dll,
            # which only the Visual C++ redistributable installs.
            rustflags: -C target-feature=+crt-static
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "launcher -> target"
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libfontconfig-dev \
            libvulkan-dev libasound2-dev libudev-dev zstd
      - name: Version from the tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "HORIZON_LAUNCHER_VERSION=$version" >> "$GITHUB_ENV"
          echo "SCORIA_VERSION=$version" >> "$GITHUB_ENV"
      - name: Package
        run: ${{ matrix.script }}
      - name: Check the Windows binaries' imports
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # The single launcher binary must run on a clean Windows: +crt-static, no
          # addon and no Visual C++ redistributable.
          python tools/check_imports.py --shipped dist/windows dist/windows/scoria.exe
      - name: Release artifact checks
        shell: bash
        run: |
          python -m pip install --quiet pytest pytest-timeout
          SCORIA_ARTIFACTS=dist python -m pytest tests/pytest/test_release_artifacts.py -q
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.file }}
          if-no-files-found: error
          retention-days: 7

  game:
    name: game (${{ matrix.name }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            script: sh tools/package_game.sh
            file: dist/scoria-game-linux-x86_64.tar.*
          - name: windows-x64
            os: windows-latest
            script: sh tools/package_game_windows.sh
            file: dist/scoria-game-windows-x64.zip
            # Same static C runtime as the launcher: the game runs on a machine
            # without the Visual C++ redistributable.
            rustflags: -C target-feature=+crt-static
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libfontconfig-dev \
            libvulkan-dev libasound2-dev libudev-dev zstd
      - name: Package
        run: ${{ matrix.script }}
      - name: Check the game binaries' imports
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python tools/check_imports.py \
            dist/game-windows-x64/horizon-windows-x64/horizon-client.exe \
            dist/game-windows-x64/horizon-windows-x64/horizon-ctl.exe \
            dist/game-windows-x64/horizon-windows-x64/horizon-prepare.exe \
            dist/game-windows-x64/horizon-windows-x64/horizon-server.exe
      - name: Release artifact checks
        shell: bash
        run: |
          python -m pip install --quiet pytest pytest-timeout
          SCORIA_ARTIFACTS=dist python -m pytest tests/pytest/test_release_artifacts.py -q
      - uses: actions/upload-artifact@v4
        with:
          name: game-${{ matrix.name }}
          path: ${{ matrix.file }}
          if-no-files-found: error
          retention-days: 7

  package-macos:
    name: package (macOS, self-hosted)
    needs: verify
    if: vars.MAC_RUNNER != ''
    runs-on: ${{ vars.MAC_RUNNER }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "launcher -> target"
      - name: Add the Intel target
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Package both architectures
        env:
          MACOS_SIGN_IDENTITY: ${{ vars.MACOS_SIGN_IDENTITY }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          SCORIA_VERSION="$version" sh tools/package_macos.sh arm64
          SCORIA_VERSION="$version" sh tools/package_macos.sh x64
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/scoria-launcher-macos-*.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish
    needs: [package, game, package-macos]
    if: |
      always() &&
      startsWith(github.ref, 'refs/tags/') &&
      needs.package.result == 'success' &&
      needs.game.result == 'success' &&
      (needs.package-macos.result == 'success' || needs.package-macos.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Split launcher and engine assets
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "GAME_TAG=v${version}-game" >> "$GITHUB_ENV"
          mkdir -p dist/launcher dist/game
          mv dist/scoria-launcher-* dist/launcher/
          mv dist/scoria-game-* dist/game/
      - name: Sign checksums
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "Set the release environment secret RELEASE_SIGNING_KEY (base64 PKCS#8 Ed25519)." >&2
            exit 1
          fi
          bash tools/ci/sign_release.sh "${{ github.ref_name }}" dist/launcher/scoria-launcher-*
          bash tools/ci/sign_release.sh "$GAME_TAG" dist/game/scoria-game-*
      - name: Verify signatures
        run: |
          cargo run --quiet -p horizon-release-sign -- verify --tag "${{ github.ref_name }}" dist/launcher
          cargo run --quiet -p horizon-release-sign -- verify --tag "$GAME_TAG" dist/game
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v want="$version" '
            /^## \[/ {
              section = $0
              gsub(/^## \[|\].*$/, "", section)
              printing = (section == want)
              if (printing) next
            }
            printing' CHANGELOG.md | sed '/./,$!d' > dist/release-notes.md
          if [ ! -s dist/release-notes.md ]; then
            echo "No CHANGELOG.md section for $version; the release body will say so." >&2
            echo "See CHANGELOG.md in the repository for the full history." > dist/release-notes.md
          fi
          head -20 dist/release-notes.md
      - name: Publish launcher release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # A re-tag replaces the old release, so the asset order is rebuilt from scratch.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" -y
          fi
          gh release create "$TAG" \
            --title "Scoria $TAG" \
            --notes-file dist/release-notes.md \
            --latest
          # The player-facing release carries the launcher only. The engine bundle lives in its
          # own release, so a first-time visitor cannot pick the wrong archive.
          gh release upload "$TAG" --clobber \
            dist/launcher/scoria-launcher-*.tar.zst \
            dist/launcher/scoria-launcher-*.zip \
            dist/launcher/SHA256SUMS \
            dist/launcher/SHA256SUMS.sig
      - name: Publish engine release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GAME_TAG" >/dev/null 2>&1; then
            gh release delete "$GAME_TAG" -y
          fi
          gh release create "$GAME_TAG" \
            --title "Engine bundle ${GAME_TAG#v} (do not download)" \
            --notes "The game engine bundle for Scoria. The launcher downloads and installs this itself; there is nothing to pick here. It contains no Minecraft assets." \
            --prerelease
          gh release upload "$GAME_TAG" --clobber \
            dist/game/scoria-game-*.tar.zst \
            dist/game/scoria-game-*.zip \
            dist/game/SHA256SUMS \
            dist/game/SHA256SUMS.sig
