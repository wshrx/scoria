name: release
# Builds the launcher for Linux, macOS (Apple silicon) and Windows, then attaches the three
# archives plus SHA256SUMS to the GitHub Release for the tag. The game client is a separate
# artifact: see docs/public/RELEASE.md (signed client bundles are the next step).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    name: package (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            script: sh tools/package_ui.sh
            file: dist/scoria-launcher-linux-x86_64.tar.gz
          - name: macos-arm64
            os: macos-14
            script: sh tools/package_macos.sh
            file: dist/scoria-launcher-macos-arm64.zip
          - name: windows-x64
            os: windows-latest
            script: sh tools/package_windows.sh
            file: dist/scoria-launcher-windows-x64.zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "launcher -> target"
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-xcb-dev libfontconfig-dev \
            libvulkan-dev libasound2-dev libudev-dev
      - name: Package
        run: ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.file }}
          if-no-files-found: error

  publish:
    name: publish
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum scoria-launcher-* > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/scoria-launcher-*.tar.gz
            dist/scoria-launcher-*.zip
            dist/SHA256SUMS
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          fail_on_unmatched_files: true
