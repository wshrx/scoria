name: release
# Builds the launcher for Linux, macOS (Apple silicon) and Windows, and the game bundle for Linux
# and Windows (macOS game bundle deferred), then attaches the archives plus SHA256SUMS to the
# GitHub Release for the tag. The game archives carry no Minecraft assets; signing is the next
# release step (docs/public/RELEASE.md).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    name: package (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            script: sh tools/package_ui.sh
            file: dist/scoria-launcher-linux-x86_64.tar.gz
          - name: macos-arm64
            os: macos-14
            script: sh tools/package_macos.sh
            file: dist/scoria-launcher-macos-arm64.zip
          - name: windows-x64
            os: windows-latest
            script: sh tools/package_windows.sh
            file: dist/scoria-launcher-windows-x64.zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "launcher -> target"
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-xcb-dev libfontconfig-dev \
            libvulkan-dev libasound2-dev libudev-dev
      - name: Package
        run: ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.file }}
          if-no-files-found: error

  game:
    name: game (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            script: sh tools/package_game.sh
            file: dist/horizon-linux-x86_64.tar.gz
          - name: windows-x64
            os: windows-latest
            script: sh tools/package_game_windows.sh
            file: dist/horizon-windows-x64.zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-xcb-dev libfontconfig-dev \
            libvulkan-dev libasound2-dev libudev-dev
      - name: Package
        run: ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: game-${{ matrix.name }}
          path: ${{ matrix.file }}
          if-no-files-found: error

  publish:
    name: publish
    needs: [package, game]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Sign checksums
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "Set the release environment secret RELEASE_SIGNING_KEY (base64 PKCS#8 Ed25519)." >&2
            exit 1
          fi
          sh tools/ci/sign_release.sh "${{ github.ref_name }}" dist/scoria-launcher-* dist/horizon-*
      - name: Verify signatures
        run: cargo run --quiet -p horizon-release-sign -- verify --tag "${{ github.ref_name }}" dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/scoria-launcher-*.tar.gz
            dist/scoria-launcher-*.zip
            dist/horizon-*.tar.gz
            dist/horizon-*.zip
            dist/SHA256SUMS
            dist/SHA256SUMS.sig
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          fail_on_unmatched_files: true
