[package]
name = "scoria-ui"
version = "0.1.3"
edition = "2021"
publish = false

[[bin]]
name = "scoria"
path = "src/main.rs"

[target.'cfg(windows)'.build-dependencies]
# The icon and version resource in scoria-ui.exe (build.rs).
winresource = "0.1"

[features]
default = []
# Developer harness only: `--features dev-scripts` and SCORIA_DEV_SCRIPTS.
dev-scripts = ["dep:scoria-hooks"]

[dependencies]
gpui-ce = { workspace = true }
gpui_ce_platform = { workspace = true }
gpui_ce_elements = "0.3.0"
scoria-ui-kit = { path = "../ui-kit" }
scoria-hooks = { path = "../hooks", optional = true }
scoria-core = { path = "..", package = "horizon-launcher" }
serde_json = "1"
# The window refreshes worlds/mods/packs when the selected instance changes on disk.
notify = "8"
