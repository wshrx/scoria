[package]
name = "scoria-ui"
version = "0.1.3"
edition = "2021"
publish = false

[[bin]]
name = "scoria"
path = "src/main.rs"

[target.'cfg(windows)'.build-dependencies]
# The icon and version resource in scoria-ui.exe (build.rs).
winresource = "0.1"

[features]
# Optional scripting layer: `cargo build -p scoria-ui --features scripts`.
scripts = ["dep:mimas"]

[dependencies]
gpui-ce = { workspace = true }
gpui_ce_platform = { workspace = true }
gpui_ce_elements = "0.3.0"
scoria-ui-kit = { path = "../ui-kit" }
scoria-core = { path = "..", package = "horizon-launcher" }
serde_json = "1"
# The window refreshes worlds/mods/packs when the selected instance changes on disk.
notify = "8"
# A small, typed scripting layer for local launcher hooks. Off by default.
mimas = { version = "0.4", optional = true, default-features = false }
